<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f3d3e" />
    <title>Sign in — BMU AI Academic Advisor</title>
    <script src="theme.js"></script>
    <link rel="icon" type="image/svg+xml" href="/advisor-icon.svg?v=20260821" />
    <link rel="icon" type="image/png" sizes="192x192" href="/advisor-icon-192.png?v=20260821" />
    <link rel="apple-touch-icon" href="/advisor-icon-192.png?v=20260821" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="advisor.css" />
    <link rel="stylesheet" href="pages.css?v=20260825-login-landscape-scroll" />
    <script src="avatars-svg.js?v=20260824-academic-male-avatar2"></script>
</head>
<body class="auth-page login-page">
    <header class="top-bar">
        <a class="brand" href="/">
            <img src="bmulogo.png" alt="BMU" />
            <div>
                <strong>BMU AI Academic Advisor</strong>
                <small>Sign in to continue</small>
            </div>
        </a>
        <nav class="top-actions">
            <a href="/" class="link-muted"><i class="fa-solid fa-arrow-left"></i> Back home</a>
            <button id="themeToggleBtn" class="icon-btn" title="Toggle light/dark theme" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
        </nav>
    </header>

    <main class="auth-shell">
        <section class="auth-card">
            <h1>Welcome back</h1>
            <p class="lede">Sign in to chat with Dr. Tari, browse the handbook, and pick up where you left off.</p>

            <div id="banner" class="auth-banner hidden">
                <i class="fa-solid fa-circle-info"></i>
                <span id="bannerMsg"></span>
            </div>
            <div id="errorBox" class="auth-error hidden"></div>

            <form class="auth-form" id="loginForm" autocomplete="on">
                <label>
                    Email
                    <input type="email" name="email" required autocomplete="username" placeholder="you@bmu.edu.ng" />
                </label>
                <label>
                    Password
                    <div class="password-field">
                        <input type="password" id="loginPassword" name="password" required autocomplete="current-password" placeholder="••••••••" minlength="6" />
                        <button type="button" class="password-toggle" data-target="loginPassword" aria-label="Show password" aria-pressed="false">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </label>

                <fieldset class="advisor-pick" aria-label="Choose your advisor">
                    <legend>Choose your advisor</legend>
                    <label class="advisor-pick-card">
                        <input type="radio" name="advisorGender" value="medical" checked />
                        <div class="advisor-pick-thumb" data-gender="medical"></div>
                        <span>Dr. Tari</span>
                    </label>
                    <label class="advisor-pick-card">
                        <input type="radio" name="advisorGender" value="academic-male" />
                        <div class="advisor-pick-thumb" data-gender="academic-male"></div>
                        <span>Academic Male</span>
                    </label>
                    <label class="advisor-pick-card">
                        <input type="radio" name="advisorGender" value="female" />
                        <div class="advisor-pick-thumb" data-gender="female"></div>
                        <span>Female</span>
                    </label>
                    <label class="advisor-pick-card">
                        <input type="radio" name="advisorGender" value="male" />
                        <div class="advisor-pick-thumb" data-gender="male"></div>
                        <span>Male</span>
                    </label>
                </fieldset>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign in
                </button>
                <p class="alt-action">
                    New to BMU AI Advisor? <a href="/register" id="registerLink">Create an account</a>
                </p>
                <p class="alt-action" style="margin-top: 4px;">
                    <a href="#" id="forgotLink">Forgot your password?</a>
                </p>
            </form>
        </section>
    </main>

    <script>
    (() => {
        // Render the inline-SVG avatar thumbnails into the picker cards.
        // Login & register both use this same hook; the SVGs come from
        // avatars-svg.js so the markup stays in one place.
        document.querySelectorAll('.advisor-pick-thumb').forEach(host => {
            const g = ['medical', 'academic-male', 'male', 'female'].includes(host.dataset.gender) ? host.dataset.gender : 'medical';
            host.innerHTML = window.BMUAvatars ? window.BMUAvatars.thumb(g) : '';
        });

        const params = new URLSearchParams(location.search);
        const nextRaw = params.get('next') || '/advisor';
        const next = /^\/(?!\/)/.test(nextRaw) && !nextRaw.startsWith('/login') ? nextRaw : '/advisor';
        const presetQ = params.get('q');
        const reason = params.get('reason');

        function writeAuthTrace(step, details = {}) {
            try {
                sessionStorage.setItem('bmu_auth_trace', JSON.stringify({
                    step,
                    at: new Date().toISOString(),
                    path: location.pathname + location.search,
                    ...details
                }));
            } catch (_) {}
        }

        function readAuthTrace() {
            try { return JSON.parse(sessionStorage.getItem('bmu_auth_trace') || 'null'); }
            catch (_) { return null; }
        }

        function clearAuthCache() {
            try { localStorage.removeItem('bmu_token'); } catch (_) {}
            try { sessionStorage.removeItem('bmu_token'); } catch (_) {}
            try { localStorage.removeItem('bmu_user'); } catch (_) {}
            try { localStorage.removeItem('bmu_advisor_session'); } catch (_) {}
            try { localStorage.removeItem('bmu_advisor_sessions'); } catch (_) {}
        }

        function getStoredToken() {
            return localStorage.getItem('bmu_token') || sessionStorage.getItem('bmu_token') || '';
        }

        function hasCookieSessionMarker() {
            return /(?:^|;\s*)bmu_auth_present=1(?:;|$)/.test(document.cookie || '');
        }

        async function verifyExistingSession() {
            const existing = getStoredToken();
            if (!existing && !hasCookieSessionMarker()) return false;
            try {
                const r = await fetch('/api/users/me', {
                    headers: existing ? { Authorization: 'Bearer ' + existing } : {},
                    credentials: 'same-origin',
                    cache: 'no-store'
                });
                if (!r.ok) {
                    if (getStoredToken() === existing) clearAuthCache();
                    return false;
                }
                if (getStoredToken() !== existing) return false;
                return true;
            } catch (_) {
                return false;
            }
        }

        // Carry next/q into the register link so the round-trip is preserved.
        const regLink = document.getElementById('registerLink');
        const regUrl = new URL('/register', location.origin);
        regUrl.searchParams.set('next', next);
        if (presetQ) regUrl.searchParams.set('q', presetQ);
        regLink.href = regUrl.pathname + regUrl.search;

        // Optional banner: show a friendly note if user came from a topic tile.
        if (presetQ || reason) {
            const banner = document.getElementById('banner');
            const msg = reason === 'expired'
                ? 'Your session expired. Please sign in again to continue.'
                : reason
                    ? 'Please sign in again to continue.'
                    : 'Sign in to ask Dr. Tari: "' + presetQ + '"';
            document.getElementById('bannerMsg').textContent = msg;
            banner.classList.remove('hidden');
        }

        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('errorBox');
        const submitBtn = document.getElementById('submitBtn');

        verifyExistingSession().then(valid => {
            if (valid && !form.dataset.submitting) {
                writeAuthTrace('login_existing_session_redirect', { next });
                window.location.replace(next);
            }
        });

        document.querySelectorAll('.password-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.target);
                if (!input) return;
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
                btn.setAttribute('aria-pressed', show ? 'true' : 'false');
                const icon = btn.querySelector('i');
                if (icon) {
                    icon.classList.toggle('fa-eye', !show);
                    icon.classList.toggle('fa-eye-slash', show);
                }
            });
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            form.dataset.submitting = '1';
            errorBox.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in…';

            const fd = new FormData(form);
            const advisorGender = ['medical', 'academic-male', 'male', 'female'].includes(fd.get('advisorGender')) ? fd.get('advisorGender') : 'medical';
            const serverAdvisorGender = advisorGender === 'male' || advisorGender === 'academic-male' ? 'male' : 'female';
            const payload = { email: fd.get('email'), password: fd.get('password') };

            try {
                writeAuthTrace('login_submit', { next, email: String(payload.email || '').toLowerCase() });
                const r = await fetch('/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(payload)
                });
                const data = await r.json();
                writeAuthTrace('login_response', {
                    status: r.status,
                    success: Boolean(data.success),
                    hasToken: Boolean(data.token),
                    next
                });
                if (!r.ok || !data.success) {
                    throw new Error(data.error || 'Sign-in failed');
                }
                clearAuthCache();
                // Store token + user info; remember-me via localStorage by default
                try { localStorage.setItem('bmu_token', data.token); } catch (_) {}
                try { sessionStorage.setItem('bmu_token', data.token); } catch (_) {}

                // The user picked an advisor on this form — that should
                // override whatever's saved server-side. Persist the choice
                // both locally (so the next page renders instantly) and on
                // the server (so it sticks across devices).
                if (data.user) {
                    data.user.advisorGender = advisorGender;
                }
                try { localStorage.setItem('bmu_user', JSON.stringify(data.user)); } catch (_) {}
                try { sessionStorage.setItem('bmu_user', JSON.stringify(data.user)); } catch (_) {}
                try { localStorage.setItem('bmu_advisor_gender', advisorGender); } catch (_) {}
                fetch('/api/users/advisor-preference', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: 'Bearer ' + data.token
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({ gender: serverAdvisorGender })
                }).catch(() => { /* non-fatal — local copy already saved */ });

                // If the admin created this account they must pick a fresh
                // password before reaching the rest of the app.
                if (data.user && data.user.mustChangePassword) {
                    window.location.replace('/change-password');
                    return;
                }

                // Hand back to whatever page asked us to authenticate
                let target = next;
                if (presetQ) target += (target.includes('?') ? '&' : '?') + 'q=' + encodeURIComponent(presetQ);
                writeAuthTrace('login_redirect_to_next', { target, tokenLength: String(data.token || '').length });
                window.location.replace(target);
            } catch (err) {
                writeAuthTrace('login_error', { error: err.message || 'Sign-in failed' });
                errorBox.textContent = err.message || 'Sign-in failed. Please try again.';
                errorBox.classList.remove('hidden');
            } finally {
                delete form.dataset.submitting;
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign in';
            }
        });

        // Forgot password — friendly stub.
        document.getElementById('forgotLink').addEventListener('click', (e) => {
            e.preventDefault();
            const email = form.querySelector('input[name=email]').value.trim();
            if (!email) {
                alert('Type your email above first, then click "Forgot your password?" again.');
                return;
            }
            fetch('/api/users/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            }).then(r => r.json()).then(data => {
                alert(data.message || 'If an account exists for that email, a reset link has been sent.');
            }).catch(() => alert('Could not send reset link right now.'));
        });
    })();
    </script>
    <script src="footer.js" defer></script>
</body>
</html>
