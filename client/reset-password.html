<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f3d3e" />
    <title>Reset your password — BMU AI Advisor</title>
    <script src="theme.js"></script>
    <link rel="icon" type="image/svg+xml" href="/advisor-icon.svg?v=20260821" />
    <link rel="icon" type="image/png" sizes="192x192" href="/advisor-icon-192.png?v=20260821" />
    <link rel="apple-touch-icon" href="/advisor-icon-192.png?v=20260821" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="advisor.css" />
    <link rel="stylesheet" href="pages.css" />
</head>
<body class="auth-page reset-password-page">
    <header class="top-bar">
        <a class="brand" href="/">
            <img src="bmulogo.png" alt="BMU" />
            <div>
                <strong>BMU AI Academic Advisor</strong>
                <small>Password reset</small>
            </div>
        </a>
        <nav class="top-actions">
            <a href="/login" class="link-muted"><i class="fa-solid fa-arrow-left"></i> Back to sign in</a>
        </nav>
    </header>

    <main class="auth-shell">
        <section class="auth-card">
            <h1><i class="fa-solid fa-key"></i> Set a new password</h1>
            <p class="lede">Choose a strong password, then sign in again.</p>

            <div id="errorBox" class="auth-error hidden"></div>
            <div id="successBox" class="auth-success hidden"></div>

            <form class="auth-form" id="resetForm" novalidate>
                <label>
                    New password
                    <div class="password-field">
                        <input type="password" id="resetNewPassword" name="newPassword" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters" />
                        <button type="button" class="password-toggle" data-target="resetNewPassword" aria-label="Show new password" aria-pressed="false">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </label>
                <label>
                    Confirm new password
                    <div class="password-field">
                        <input type="password" id="resetConfirmPassword" name="confirmPassword" required minlength="8" autocomplete="new-password" placeholder="Repeat your new password" />
                        <button type="button" class="password-toggle" data-target="resetConfirmPassword" aria-label="Show confirmation password" aria-pressed="false">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </label>
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <i class="fa-solid fa-floppy-disk"></i> Reset password
                </button>
            </form>
        </section>
    </main>

    <script>
    (() => {
        const params = new URLSearchParams(location.search);
        const fromQuery = params.get('token');
        const hash = String(location.hash || '');
        const hashQuery = hash.includes('?') ? new URLSearchParams(hash.split('?')[1]).get('token') : null;
        const token = fromQuery || hashQuery;

        const form = document.getElementById('resetForm');
        const errorBox = document.getElementById('errorBox');
        const successBox = document.getElementById('successBox');
        const submitBtn = document.getElementById('submitBtn');

        document.querySelectorAll('.password-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.target);
                if (!input) return;
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
                btn.setAttribute('aria-pressed', show ? 'true' : 'false');
                const icon = btn.querySelector('i');
                if (icon) {
                    icon.classList.toggle('fa-eye', !show);
                    icon.classList.toggle('fa-eye-slash', show);
                }
            });
        });

        if (!token) {
            errorBox.textContent = 'Missing or invalid reset token. Request a new reset link from sign in.';
            errorBox.classList.remove('hidden');
            form.classList.add('hidden');
            return;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');

            const fd = new FormData(form);
            const newPassword = String(fd.get('newPassword') || '');
            const confirmPassword = String(fd.get('confirmPassword') || '');

            if (newPassword !== confirmPassword) {
                errorBox.textContent = 'Passwords do not match.';
                errorBox.classList.remove('hidden');
                return;
            }
            if (newPassword.length < 8) {
                errorBox.textContent = 'Password must be at least 8 characters.';
                errorBox.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Resetting…';

            try {
                const r = await fetch('/api/users/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword, confirmPassword })
                });
                const data = await r.json();
                if (!r.ok || !data.success) {
                    if (Array.isArray(data.errors) && data.errors.length) {
                        throw new Error(data.errors.map(x => x.msg || x.message || x).join('; '));
                    }
                    throw new Error(data.error || 'Could not reset password');
                }

                successBox.textContent = data.message || 'Password reset successful. Redirecting to sign in…';
                successBox.classList.remove('hidden');
                setTimeout(() => location.replace('/login'), 1200);
            } catch (err) {
                errorBox.textContent = err.message || 'Failed to reset password.';
                errorBox.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Reset password';
            }
        });
    })();
    </script>
    <script src="footer.js" defer></script>
</body>
</html>
