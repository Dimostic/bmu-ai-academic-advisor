<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f3d3e" />
    <title>Change your password — BMU AI Advisor</title>
    <script src="theme.js"></script>
    <link rel="icon" type="image/svg+xml" href="/advisor-icon.svg?v=20260821" />
    <link rel="icon" type="image/png" sizes="192x192" href="/advisor-icon-192.png?v=20260821" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="advisor.css" />
    <link rel="stylesheet" href="pages.css" />
</head>
<body>
    <header class="topbar">
        <a href="/" class="brand">
            <img src="bmulogo.png" alt="BMU" />
            <div>
                <strong>Dr. Tari</strong>
                <small>Bayelsa Medical University</small>
            </div>
        </a>
    </header>

    <main class="auth-shell">
        <section class="auth-card">
            <h1><i class="fa-solid fa-key"></i> Change your password</h1>
            <p class="lede">Your account was created by an administrator. Please choose a new password before you continue.</p>

            <div id="errorBox" class="auth-error hidden"></div>
            <div id="successBox" class="auth-success hidden"></div>

            <form id="changeForm" novalidate>
                <label>
                    Current (temporary) password
                    <div class="password-field">
                        <input type="password" id="currentPassword" name="currentPassword" required autocomplete="current-password" />
                        <button type="button" class="password-toggle" data-target="currentPassword" aria-label="Show current password" aria-pressed="false">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </label>
                <label>
                    New password
                    <div class="password-field">
                        <input type="password" id="newPassword" name="newPassword" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters, mix of upper, lower, digit, special" />
                        <button type="button" class="password-toggle" data-target="newPassword" aria-label="Show new password" aria-pressed="false">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </label>
                <label>
                    Confirm new password
                    <div class="password-field">
                        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8" autocomplete="new-password" />
                        <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show confirmation password" aria-pressed="false">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </label>
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <i class="fa-solid fa-floppy-disk"></i> Change password
                </button>
            </form>
        </section>
    </main>

    <script>
    (() => {
        const token = localStorage.getItem('bmu_token') || sessionStorage.getItem('bmu_token');
        if (!token) { location.replace('/login'); return; }

        const form = document.getElementById('changeForm');
        const errorBox = document.getElementById('errorBox');
        const successBox = document.getElementById('successBox');
        const submitBtn = document.getElementById('submitBtn');

        document.querySelectorAll('.password-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.target);
                if (!input) return;
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
                btn.setAttribute('aria-pressed', show ? 'true' : 'false');
                const icon = btn.querySelector('i');
                if (icon) {
                    icon.classList.toggle('fa-eye', !show);
                    icon.classList.toggle('fa-eye-slash', show);
                }
            });
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');

            const fd = new FormData(form);
            const currentPassword = fd.get('currentPassword');
            const newPassword     = fd.get('newPassword');
            const confirm         = fd.get('confirmPassword');

            if (newPassword !== confirm) {
                errorBox.textContent = 'New passwords do not match.';
                errorBox.classList.remove('hidden');
                return;
            }
            if (newPassword === currentPassword) {
                errorBox.textContent = 'New password must be different from the temporary password.';
                errorBox.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving…';
            try {
                const r = await fetch('/api/users/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: 'Bearer ' + token
                    },
                    body: JSON.stringify({ currentPassword, newPassword, confirmPassword: confirm })
                });
                const data = await r.json();
                if (!r.ok || !data.success) {
                    if (Array.isArray(data.errors) && data.errors.length) {
                        throw new Error(data.errors.map(x => x.msg || x.message || x).join('; '));
                    }
                    throw new Error(data.error || 'Could not change password');
                }
                // Clear the must-change flag we cached on login.
                try {
                    const u = JSON.parse(localStorage.getItem('bmu_user') || 'null');
                    if (u) {
                        u.mustChangePassword = false;
                        localStorage.setItem('bmu_user', JSON.stringify(u));
                    }
                } catch (_) { /* noop */ }
                successBox.textContent = 'Password updated. Taking you to the advisor…';
                successBox.classList.remove('hidden');
                setTimeout(() => { location.replace('/advisor'); }, 900);
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Change password';
            }
        });
    })();
    </script>
    <script src="footer.js" defer></script>
</body>
</html>
