<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f3d3e" />
    <title>Admin — BMU AI Academic Advisor</title>
    <script src="theme.js"></script>
    <link rel="icon" type="image/png" href="bmulogo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="advisor.css" />
    <link rel="stylesheet" href="pages.css" />
    <style>
        #advisorStatusPill[data-status="alert"] {
            animation: advisor-pill-pulse 1.4s ease-in-out infinite;
        }

        #advisorStatusPill[data-status="warning"] {
            box-shadow: 0 0 0 1px rgba(232,170,0,.14), 0 0 0 6px rgba(232,170,0,.04);
        }

        @keyframes advisor-pill-pulse {
            0%, 100% { transform: translateY(0); box-shadow: 0 0 0 1px rgba(190,51,58,.10); }
            50% { transform: translateY(-1px); box-shadow: 0 0 0 1px rgba(190,51,58,.24), 0 0 0 8px rgba(190,51,58,.06); }
        }

        @media (max-width: 720px) {
            #advisorAlertBanner {
                padding: 10px 14px 0;
            }

            #advisorAlertBanner > div {
                padding: 12px 14px !important;
                border-radius: 16px !important;
            }

            #advisorStatusPill {
                display: none !important;
            }

            #advisorMobileStrip {
                display: block !important;
            }
        }

        @media (min-width: 721px) {
            #advisorMobileStrip {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <a class="brand" href="/">
            <img src="bmulogo.png" alt="BMU" />
            <div>
                <strong>BMU AI Advisor</strong>
                <small>Admin portal</small>
            </div>
        </a>
        <nav class="top-actions">
            <a href="/advisor" class="link-muted"><i class="fa-solid fa-message"></i> Advisor</a>
            <a href="/handbook" class="link-muted"><i class="fa-solid fa-book-open"></i> Handbook</a>
            <button id="themeToggleBtn" class="icon-btn" title="Toggle light/dark theme" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
            <span id="advisorStatusPill" class="badge" style="display:none; margin-left: 4px;"></span>
            <div id="authSlot"></div>
        </nav>
    </header>

    <section id="advisorAlertBanner" aria-live="polite" style="margin: 0 auto; max-width: 1320px; padding: 14px 20px 0;"></section>
    <div id="advisorMobileStrip" aria-live="polite" style="display:none; position: sticky; bottom: 0; z-index: 20; margin: 12px 14px 0; padding-bottom: 10px;"></div>

    <main class="admin-shell">
        <aside class="admin-nav" aria-label="Admin sections">
            <button data-section="dashboard"><i class="fa-solid fa-gauge-high"></i> Dashboard</button>
            <button data-section="advisorOps"><i class="fa-solid fa-heart-pulse"></i> Advisor Ops</button>
            <button data-section="documents"><i class="fa-solid fa-folder-open"></i> Documents</button>
            <button data-section="documentLab"><i class="fa-solid fa-flask-vial"></i> Document Lab</button>
            <button data-section="faqs"><i class="fa-solid fa-comments"></i> FAQs</button>
            <button data-section="curate"><i class="fa-solid fa-star"></i> Curate Q&amp;A</button>
            <button data-section="users"><i class="fa-solid fa-users"></i> Users</button>
            <button data-section="audit"><i class="fa-solid fa-shield-halved"></i> Audit trail</button>
            <button data-section="escalations"><i class="fa-solid fa-headset"></i> Escalations</button>
            <button data-section="metrics"><i class="fa-solid fa-chart-line"></i> Retrieval metrics</button>
        </aside>

        <section class="admin-main" id="adminMain">
            <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading…</div>
        </section>
    </main>

    <div id="toastHost" aria-live="polite"></div>

    <script src="admin.js?v=20260815-document-lab" defer></script>
    <script src="footer.js" defer></script>
</body>
</html>
